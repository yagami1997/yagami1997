<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="title desc">
  <title id="title">What I care about</title>
  <desc id="desc">I&#x27;m interested in workflows that get better with use: reusable tools, useful memory, and enough visibility to understand a failure and keep going.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#f6a18b" stroke-width="3" stroke-linecap="round"/>
