<svg xmlns="http://www.w3.org/2000/svg" width="390" height="472" viewBox="0 0 390 472" role="img" aria-labelledby="title desc">
  <title id="title">To request a private channel</title>
  <desc id="desc">1. Click the GPG button below to open an issue. 2. Share your GPG public key block or 40-character fingerprint (must be on keys.openpgp.org). 3. I&#x27;ll reply with my GPG fingerprint encrypted to your key — import it from keys.openpgp.org to find my address, then send encrypted email only.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#bb482f" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="53" fill="#20242b" font-size="22" font-weight="600">To request a private channel</text><text x="14" y="91" fill="#20242b" font-size="21">1. Click the GPG button below to</text><text x="14" y="119" fill="#20242b" font-size="21">open an issue.</text><text x="14" y="147" fill="#20242b" font-size="21"></text><text x="14" y="175" fill="#20242b" font-size="21">2. Share your GPG public key block</text><text x="14" y="203" fill="#20242b" font-size="21">or 40-character fingerprint (must</text><text x="14" y="231" fill="#20242b" font-size="21">be on keys.openpgp.org).</text><text x="14" y="259" fill="#20242b" font-size="21"></text><text x="14" y="287" fill="#20242b" font-size="21">3. I&#x27;ll reply with my GPG</text><text x="14" y="315" fill="#20242b" font-size="21">fingerprint encrypted to your key</text><text x="14" y="343" fill="#20242b" font-size="21">— import it from keys.openpgp.org</text><text x="14" y="371" fill="#20242b" font-size="21">to find my address, then send</text><text x="14" y="399" fill="#20242b" font-size="21">encrypted email only.</text></g>
</svg>
