<svg xmlns="http://www.w3.org/2000/svg" width="390" height="472" viewBox="0 0 390 472" role="img" aria-labelledby="title desc">
  <title id="title">A small decryption puzzle</title>
  <desc id="desc">For general questions, ideas, or feedback — GitHub issues are the right place. If you need to reach me privately, I only accept contact through GPG-encrypted channels. No plain email, no DMs. Think of it as a small decryption puzzle — if you can play this game, we already speak the same language.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#f6a18b" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="53" fill="#f0f3f6" font-size="22" font-weight="600">A small decryption puzzle</text><text x="14" y="91" fill="#f0f3f6" font-size="21">For general questions, ideas, or</text><text x="14" y="119" fill="#f0f3f6" font-size="21">feedback — GitHub issues are the</text><text x="14" y="147" fill="#f0f3f6" font-size="21">right place.</text><text x="14" y="175" fill="#f0f3f6" font-size="21"></text><text x="14" y="203" fill="#f0f3f6" font-size="21">If you need to reach me privately,</text><text x="14" y="231" fill="#f0f3f6" font-size="21">I only accept contact through</text><text x="14" y="259" fill="#f0f3f6" font-size="21">GPG-encrypted channels. No plain</text><text x="14" y="287" fill="#f0f3f6" font-size="21">email, no DMs.</text><text x="14" y="315" fill="#f0f3f6" font-size="21"></text><text x="14" y="343" fill="#f0f3f6" font-size="21">Think of it as a small decryption</text><text x="14" y="371" fill="#f0f3f6" font-size="21">puzzle — if you can play this</text><text x="14" y="399" fill="#f0f3f6" font-size="21">game, we already speak the same</text><text x="14" y="427" fill="#f0f3f6" font-size="21">language.</text></g>
</svg>
