<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="title desc">
  <title id="title">How I work</title>
  <desc id="desc">I move between research, code, and writing with agents in the loop. I set the problem and bring the context; they help explore, implement, and iterate. Tests and real outputs tell me what holds up. I decide what ships.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#bb482f" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="53" fill="#20242b" font-size="22" font-weight="600">How I work</text><text x="14" y="91" fill="#20242b" font-size="21">I move between research, code, and</text><text x="14" y="119" fill="#20242b" font-size="21">writing with agents in the loop. I</text><text x="14" y="147" fill="#20242b" font-size="21">set the problem and bring the</text><text x="14" y="175" fill="#20242b" font-size="21">context; they help explore,</text><text x="14" y="203" fill="#20242b" font-size="21">implement, and iterate.</text><text x="14" y="231" fill="#20242b" font-size="21"></text><text x="14" y="259" fill="#20242b" font-size="21">Tests and real outputs tell me</text><text x="14" y="287" fill="#20242b" font-size="21">what holds up. I decide what</text><text x="14" y="315" fill="#20242b" font-size="21">ships.</text></g>
</svg>
