<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Systems Over Hype</title>
  <desc id="desc">Yagami1997. Independent builder in Del Mar. Building with AI, thinking for myself.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1">
      <stop stop-color="#101326"/>
      <stop offset=".55" stop-color="#14172b"/>
      <stop offset="1" stop-color="#10252d"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop stop-color="#9280ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#9280ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint">
      <stop stop-color="#67e8d1" stop-opacity=".23"/>
      <stop offset="1" stop-color="#67e8d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x2="1" y2=".4">
      <stop stop-color="#a395ff" stop-opacity=".06"/>
      <stop offset=".48" stop-color="#b9aeff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#70e5d3" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#bfb1ff"/>
      <stop offset="1" stop-color="#83ecda"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="340" fill="url(#base)"/>
    <ellipse cx="210" cy="60" rx="440" ry="270" fill="url(#violet)"/>
    <ellipse cx="800" cy="310" rx="430" ry="290" fill="url(#mint)"/>
    <g fill="none" stroke="url(#orbit)">
      <ellipse cx="480" cy="179" rx="560" ry="112" transform="rotate(-19 480 179)"/>
      <ellipse cx="480" cy="179" rx="580" ry="166" transform="rotate(-19 480 179)" opacity=".45"/>
    </g>
    <circle cx="827" cy="89" r="4" fill="#a4efe0"/>
    <circle cx="130" cy="258" r="3" fill="#c2b4ff"/>
    <rect x=".5" y=".5" width="959" height="339" rx="20" fill="none" stroke="#c5bcff" stroke-opacity=".15"/>
    <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="480" y="69" fill="#d1cbe7" font-size="17" letter-spacing="3">YAGAMI1997 · INDEPENDENT BUILDER</text>
      <text x="480" y="156" fill="#f6f5ff" font-size="66" font-weight="700" letter-spacing="-2.5">Systems Over Hype.</text>
      <text x="480" y="207" fill="#d9daeb" font-size="24">Building with AI. Thinking for myself.</text>
      <rect x="442" y="241" width="76" height="2" rx="1" fill="url(#accent)"/>
      <text x="480" y="286" fill="#b9c7d6" font-size="16" letter-spacing="2">DEL MAR, CA  /  BUILDING IN THE OPEN</text>
    </g>
  </g>
</svg>
