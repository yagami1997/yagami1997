<svg xmlns="http://www.w3.org/2000/svg" width="390" height="444" viewBox="0 0 390 444" role="img" aria-labelledby="title desc">
  <title id="title">Building in the open</title>
  <desc id="desc">I research, write, and build software with AI as part of my everyday practice. I like understanding how things work and making tools I want to use. My projects begin with practical needs: sharing files privately, understanding my network, or making a small task easier. I share the work so others can inspect, adapt, and improve it.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#f6a18b" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="53" fill="#f0f3f6" font-size="22" font-weight="600">Building in the open</text><text x="14" y="91" fill="#f0f3f6" font-size="21">I research, write, and build</text><text x="14" y="119" fill="#f0f3f6" font-size="21">software with AI as part of my</text><text x="14" y="147" fill="#f0f3f6" font-size="21">everyday practice. I like</text><text x="14" y="175" fill="#f0f3f6" font-size="21">understanding how things work and</text><text x="14" y="203" fill="#f0f3f6" font-size="21">making tools I want to use.</text><text x="14" y="231" fill="#f0f3f6" font-size="21"></text><text x="14" y="259" fill="#f0f3f6" font-size="21">My projects begin with practical</text><text x="14" y="287" fill="#f0f3f6" font-size="21">needs: sharing files privately,</text><text x="14" y="315" fill="#f0f3f6" font-size="21">understanding my network, or</text><text x="14" y="343" fill="#f0f3f6" font-size="21">making a small task easier. I</text><text x="14" y="371" fill="#f0f3f6" font-size="21">share the work so others can</text><text x="14" y="399" fill="#f0f3f6" font-size="21">inspect, adapt, and improve it.</text></g>
</svg>
