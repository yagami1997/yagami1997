<svg xmlns="http://www.w3.org/2000/svg" width="390" height="444" viewBox="0 0 390 444" role="img" aria-labelledby="title desc">
  <title id="title">A notebook, kept in public</title>
  <desc id="desc">Field Notes is my ongoing notebook: observations from building, questions I am still working through, and things I have learned along the way. Lately, I am thinking about agent memory, permissions, and verification. I come back to these questions as I build, and revise my notes as my understanding changes.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><path d="M14 20h18" stroke="#bb482f" stroke-width="3" stroke-linecap="round"/>
